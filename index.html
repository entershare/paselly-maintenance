<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <title>定期メンテナンス中</title>
  <style>
body{
  background: linear-gradient(135deg, #51c191 0%, #3da67a 100%);
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
}

.maintenance-card {
  background: white;
  color: #333;
  border-radius: 20px;
  padding: 3rem 2rem;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  max-width: 600px;
  margin: 0 1rem;
}

.icon-wrapper {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #51c191 0%, #3da67a 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.05);
    opacity: 0.8;
  }
}

.logo-img {
  max-width: 200px;
  width: 40%;
  margin-bottom: 2rem;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
}

h1 {
  font-size: 1.875rem;
  font-weight: 700;
  margin-bottom: 1rem;
  line-height: 1.3;
}

.description {
  font-size: 1rem;
  line-height: 1.8;
  margin-bottom: 1.5rem;
  opacity: 0.95;
}

.info-box {
  background: #f0f9f5;
  border-radius: 10px;
  padding: 1rem 1.5rem;
  margin-top: 1.5rem;
  font-size: 0.9rem;
  border: 1px solid #d1f0e3;
}

a {
  color: #51c191;
  text-decoration: underline;
  font-weight: 600;
  transition: opacity 0.2s;
}

a:hover {
  opacity: 0.8;
}

@media (max-width: 640px) {
  h1 {
    font-size: 1.5rem;
  }
  .maintenance-card {
    padding: 2rem 1.5rem;
  }
}
  </style>
</head>
<body>
  <div class="flex flex-col justify-center items-center w-screen h-screen">
    <div class="maintenance-card text-center">
      <img src="./img/logo.png" alt="ロゴ" class="logo-img">

      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
      </div>

      <h1>定期メンテナンス中</h1>

      <p class="description">
        現在、システムの定期メンテナンスを実施しております。<br>
        ご利用の皆様にはご不便をおかけし、誠に申し訳ございません。
      </p>

      <div class="info-box">
        <p style="margin-bottom: 0.5rem;">メンテナンス終了までしばらくお待ちください。</p>
        <p style="margin: 0;">終了次第、通常通りご利用いただけます。</p>
      </div>

      <p style="margin-top: 2rem; font-size: 0.9rem;">
        ご不明な点がございましたら、<br>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSc7HimGK2SWgcZwC4zOgiqFtG_v8Kh_UDNHYzgivs0-_w2UKA/viewform?usp=sf_link" target="_blank">お問い合わせフォーム</a>またはチャットよりご連絡ください。
      </p>
    </div>
  </div>
</body>

  (function(){var w=window;if(w.ChannelIO){return w.console.error("ChannelIO script included twice.");}var ch=function(){ch.c(arguments);};ch.q=[];ch.c=function(args){ch.q.push(args);};w.ChannelIO=ch;function l(){if(w.ChannelIOInitialized){return;}w.ChannelIOInitialized=true;var s=document.createElement("script");s.type="text/javascript";s.async=true;s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";var x=document.getElementsByTagName("script")[0];if(x.parentNode){x.parentNode.insertBefore(s,x);}}if(document.readyState==="complete"){l();}else{w.addEventListener("DOMContentLoaded",l);w.addEventListener("load",l);}})();

</html>
